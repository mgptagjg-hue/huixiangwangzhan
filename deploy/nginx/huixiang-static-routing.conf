# Include these directives inside the canonical HTTPS server block for huixiangqimao.cn.
# Do not use `try_files ... /index.html`; this is a statically generated Astro site.

root /www/wwwroot/huixiang;
index index.html;

location / {
    try_files $uri $uri/ $uri/index.html =404;
}

error_page 404 /404.html;

location = /404.html {
    internal;
}

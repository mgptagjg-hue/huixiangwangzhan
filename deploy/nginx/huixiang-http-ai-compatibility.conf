# HTTP compatibility server blocks for huixiangqimao.cn.
# Keep the canonical HTTPS server separate and unchanged.
# Copy deploy/nginx/huixiang-http-301.html to /etc/nginx/huixiang-http-301.html.

server {
    listen 80;
    server_name 124.223.165.156 huixiangqimao.cn;

    root /www/wwwroot/huixiang;
    access_log /var/log/nginx/huixiang_access.log;
    error_log /var/log/nginx/huixiang_error.log;

    # Discovery and verification files may be read without following a redirect.
    # Their contents must continue to reference only the canonical HTTPS origin.
    location = /robots.txt {
        try_files $uri =404;
    }

    location = /sitemap.xml {
        try_files $uri =404;
    }

    location = /llms.txt {
        try_files $uri =404;
    }

    location = /ByteDanceVerify.html {
        try_files $uri =404;
    }

    location = /BingSiteAuth.xml {
        try_files $uri =404;
    }

    location = /24d0c9a09cbb007078ec63115c965aadfd8b5c3d3e8d8fae6cebddd152d7ad7e.txt {
        try_files $uri =404;
    }

    # Preserve a permanent redirect while returning a short, crawler-readable body.
    error_page 418 =301 /__huixiang_http_redirect_body;

    location / {
        return 418;
    }

    location = /__huixiang_http_redirect_body {
        internal;
        alias /etc/nginx/huixiang-http-301.html;
        types { }
        default_type "text/html; charset=utf-8";
        add_header Location https://huixiangqimao.cn$request_uri always;
    }
}

server {
    listen 80;
    server_name www.huixiangqimao.cn;
    return 301 https://huixiangqimao.cn$request_uri;
}
